<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rezepte</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #161412;
    --card: #232019;
    --card2: #2d2a22;
    --text: #f2ede4;
    --muted: #a39b8b;
    --accent: #e8a33d;
    --danger: #e0645c;
    --ok: #6fbf73;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); min-height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 18px 16px 8px; max-width: 900px; margin: 0 auto; }
  .kopf { display: flex; gap: 8px; }
  h1 { margin: 0; font-size: 28px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 11px 16px;
    background: var(--accent); color: #1b1408; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: var(--card2); color: var(--text); font-weight: 600; }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  #n8nBox { max-width: 900px; margin: 0 auto; padding: 4px 16px 8px; display: flex;
    align-items: center; gap: 10px; flex-wrap: wrap; }
  #n8nStatus { color: var(--muted); font-size: 14px; flex: 1 1 100%; }
  #chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px 12px;
    max-width: 900px; margin: 0 auto; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; background: var(--card); color: var(--muted); border-radius: 999px;
    padding: 8px 14px; font-weight: 600; font-size: 14px; }
  .chip.aktiv { background: var(--accent); color: #1b1408; }
  #liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px; padding: 4px 16px 40px; max-width: 900px; margin: 0 auto; }
  .karte { background: var(--card); border-radius: var(--radius); overflow: hidden; cursor: pointer; position: relative; }
  .karte.gewaehlt { outline: 3px solid var(--accent); }
  .karte .bild { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: var(--card2); }
  .karte .leer { width: 100%; aspect-ratio: 1 / 1; display: flex; align-items: center;
    justify-content: center; font-size: 40px; background: var(--card2); }
  .karte .info { padding: 10px 12px 12px; }
  .karte .titel { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .karte .kat { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .karte .eiwk { color: var(--accent); font-weight: 700; font-size: 13px; margin-top: 4px; }
  .haken { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%;
    background: rgba(0,0,0,.7); border: 2px solid #fff; display: flex; align-items: center;
    justify-content: center; font-weight: 700; color: #1b1408; }
  .gewaehlt .haken { background: var(--accent); border-color: var(--accent); }
  .badge { position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 700;
    padding: 3px 8px; border-radius: 8px; background: rgba(0,0,0,.7); }
  .badge.offen { color: var(--accent); }
  .badge.lokal { color: var(--danger); }
  .badge.fertig { color: var(--ok); }
  .leerhinweis { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 20px; }
  .overlay { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 10;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .hidden { display: none !important; }
  .sheet { max-width: 700px; margin: 0 auto; padding: 14px 16px 60px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .bar h2 { margin: 0; font-size: 18px; text-align: center; flex: 1; }
  label { display: block; margin: 16px 0 6px; font-weight: 700; font-size: 14px; }
  input[type="text"], input[type="url"] { width: 100%; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid #3a362c; border-radius: 12px; padding: 13px 14px; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .slot { position: relative; aspect-ratio: 1 / 1; background: var(--card); border: 2px dashed #4a4538;
    border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: var(--muted); cursor: pointer; text-align: center; }
  .slot .plus { font-size: 34px; line-height: 1; color: var(--accent); }
  .slot .name { font-size: 13px; font-weight: 600; margin-top: 6px; }
  .slot img { width: 100%; height: 100%; object-fit: cover; }
  .slot .tag { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.65);
    color: #fff; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 8px; }
  .slot .weg { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; padding: 0;
    border-radius: 50%; background: rgba(0,0,0,.7); color: #fff; font-size: 16px; line-height: 30px; }
  .fehler { color: var(--danger); min-height: 20px; margin: 12px 0 0; font-size: 14px; }
  .detail h2 { font-size: 26px; margin: 4px 0 4px; }
  .detail .kat { color: var(--muted); margin-bottom: 14px; }
  .detail .abschnitt { margin: 20px 0 8px; font-weight: 700; color: var(--accent); font-size: 14px;
    text-transform: uppercase; letter-spacing: .04em; }
  .detail img { width: 100%; display: block; border-radius: var(--radius); background: var(--card2); }
  .detail ul, .detail ol { margin: 0; padding-left: 22px; line-height: 1.55; }
  .detail li { margin-bottom: 6px; }
  .nwbox { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-top: 14px; }
  .nwbox .eiw { display: flex; align-items: baseline; gap: 10px; }
  .nwbox .zahl { font-size: 36px; font-weight: 800; color: var(--accent); line-height: 1.1; }
  .nwbox .lbl { font-weight: 700; font-size: 16px; }
  .nwbox .rest { color: var(--muted); margin-top: 6px; line-height: 1.5; font-size: 15px; }
  .nwbox .bezug { color: var(--muted); margin-top: 6px; font-size: 13px; }
  .hinweisbox { color: var(--muted); font-size: 14px; background: var(--card); padding: 12px 14px;
    border-radius: 12px; margin-top: 8px; line-height: 1.5; }
  .linkbtn { display: inline-block; text-decoration: none; background: var(--accent); color: #1b1408;
    font-weight: 700; padding: 11px 16px; border-radius: 12px; margin: 4px 0 6px; }
  .aktionen { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .aktionen button { flex: 1; }
  .gruppe { margin: 22px 0 8px; font-weight: 700; color: var(--accent); font-size: 14px;
    text-transform: uppercase; letter-spacing: .04em; }
  .pos { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: var(--card);
    border-radius: 12px; margin-bottom: 8px; }
  .pos input[type="checkbox"] { width: 22px; height: 22px; flex: 0 0 auto; accent-color: var(--accent); }
  .pos span { flex: 1; line-height: 1.35; }
  .pos.erledigt span { text-decoration: line-through; color: var(--muted); }
  .pos input.rest { width: 72px; flex: 0 0 auto; padding: 9px 8px; text-align: center; font-size: 15px; }
  .neuPos { display: flex; gap: 8px; margin-top: 8px; }
  .neuPos input { flex: 1; }
</style>
</head>
<body>

<header>
  <h1>🍳 Rezepte</h1>
  <div class="kopf">
    <button class="ghost" id="einkaufBtn" title="Einkaufsliste">🛒</button>
    <button class="ghost" id="settingsBtn" title="Einstellungen">⚙️</button>
    <button id="neuBtn">+ Neu</button>
  </div>
</header>

<div id="n8nBox">
  <button id="loginBtn" class="hidden">Mit Google anmelden</button>
  <button class="ghost" id="syncBtn">↻ Synchronisieren</button>
  <button class="ghost" id="auswahlBtn">Auswählen</button>
  <button class="danger hidden" id="loeschenBtn">Löschen (0)</button>
  <span id="n8nStatus"></span>
</div>

<div id="chips"></div>
<main id="liste"></main>

<!-- Formular -->
<div id="formView" class="overlay hidden">
  <div class="sheet">
    <div class="bar">
      <button class="ghost" id="formZu">Abbrechen</button>
      <h2 id="formTitel">Neues Rezept</h2>
      <button id="speichernBtn">Speichern</button>
    </div>

    <label for="fTitel">Titel</label>
    <input type="text" id="fTitel" placeholder="z. B. Protein-Nuggets" autocomplete="off">

    <label for="fKat">Kategorie</label>
    <input type="text" id="fKat" list="katListe" placeholder="Rezepte" autocomplete="off">
    <datalist id="katListe"></datalist>

    <label for="fLink">Link zum Video</label>
    <input type="url" id="fLink" placeholder="https://www.instagram.com/reel/..." autocomplete="off">

    <label>Bilder</label>
    <div class="slots" id="slots"></div>
    <input type="file" id="fileInput" accept="image/*" class="hidden">

    <p class="fehler" id="fFehler"></p>
  </div>
</div>

<!-- Detail -->
<div id="detailView" class="overlay hidden">
  <div class="sheet detail" id="detailInhalt"></div>
</div>

<!-- Einkaufsliste -->
<div id="einkaufView" class="overlay hidden">
  <div class="sheet">
    <div class="bar">
      <button class="ghost" id="einkaufZu">← Zurück</button>
      <h2>🛒 Einkaufsliste</h2>
      <span style="width:80px"></span>
    </div>
    <div class="hinweisbox" style="margin:0 0 12px">Im Feld „noch“ trägst du ein, wie viel du noch brauchst (z. B. bei „4 Eier“ eine 2). Leer lassen heißt: volle Menge. Eine 0 heißt: schon da.</div>
    <div class="neuPos">
      <input type="text" id="neuPosText" placeholder="Artikel hinzufügen" autocomplete="off">
      <button id="neuPosBtn">+</button>
    </div>
    <div id="einkaufInhalt"></div>
    <div class="aktionen">
      <button class="ghost" id="erledigteWeg">Erledigte entfernen</button>
      <button class="danger" id="alleWeg">Alles leeren</button>
    </div>
  </div>
</div>

<!-- Einstellungen -->
<div id="settingsView" class="overlay hidden">
  <div class="sheet">
    <div class="bar">
      <button class="ghost" id="settingsZu">← Zurück</button>
      <h2>Einstellungen</h2>
      <span style="width:80px"></span>
    </div>
    <label>Google Client-ID (nur nötig, wenn sie nicht im Code steht)</label>
    <input type="text" id="sClient" placeholder="…apps.googleusercontent.com" autocomplete="off">
    <div class="aktionen">
      <button class="ghost" id="sClientSave">Speichern und neu laden</button>
    </div>
    <label>Drive-Ordner „Rezepte“: Ordner-ID für n8n</label>
    <input type="text" id="sOrdner" readonly>
    <div class="aktionen">
      <button class="ghost" id="sKopieren">ID kopieren</button>
      <button class="ghost" id="sOrdnerNeu">Ordner neu suchen</button>
    </div>
    <label>Google-Konto</label>
    <div class="hinweisbox" id="sKonto"></div>
    <div class="aktionen">
      <button class="danger" id="sAbmelden">Abmelden</button>
    </div>
  </div>
</div>

<script>
  /* ====== EINSTELLUNGEN ====== */
  // Client-ID aus der Google Cloud Console. Alternativ trägst du sie in der App unter ⚙️ Einstellungen ein.
  var GOOGLE_CLIENT_ID = '19193012391-esegi0gpasckh74dt776ducjpj13c72t.apps.googleusercontent.com';
  var SCOPE = 'https://www.googleapis.com/auth/drive';
  var ORDNER_NAME = 'Rezepte';

  // Bildgröße: kleinere Zahlen = kleinere Dateien, aber schlechter lesbarer Text.
  var FOTO_MAX = 600;    // Längste Seite beim Essensfoto (Pixel)
  var FOTO_Q = 0.6;      // JPEG-Qualität Foto (0 bis 1)
  var TEXT_MAX = 1200;   // Längste Seite bei Text-Screenshots (Pixel), damit n8n den Text lesen kann
  var TEXT_Q = 0.6;      // JPEG-Qualität Text-Screenshots
  /* =========================== */

  var DB_NAME = 'rezepte-v2';
  var STORE = 'rezepte';
  var SLOTS = ['Essen', 'Zutaten', 'Zubereitung', 'Weiteres'];

  var db = null;
  var rezepte = [];
  var filter = 'Alle';
  var editId = null;
  var formBilder = [null, null, null, null];
  var aktuellerSlot = 0;
  var detailId = null;
  var laeuft = false;
  var nochmal = false;
  var zuletztSync = 0;
  var auswahlModus = false;
  var auswahl = {};

  var accessToken = '';
  var tokenExpires = 0;
  var tokenClient = null;

  var einkauf = { items: [] };
  var einkaufId = localStorage.getItem('einkaufId') || '';
  var einkaufTimer = null;
  try {
    var ec = JSON.parse(localStorage.getItem('einkaufCache') || 'null');
    if (ec && Array.isArray(ec.items)) einkauf = ec;
  } catch (e) { /* leer */ }

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function sichererLink(u) {
    u = (u || '').trim();
    if (!u) return '';
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return /^https?:\/\//i.test(u) ? u : '';
  }

  function clientId() { return localStorage.getItem('clientId') || GOOGLE_CLIENT_ID; }

  function hatBild(r) { return (r.bilder || []).some(function (b) { return b; }); }
  function istOffen(r) { return !r.auslesen && !r.fehler && hatBild(r); }
  function istFehler(r) { return !r.auslesen && !!r.fehler && hatBild(r); }
  function istLokal(r) { return !r.driveId || !!r.geaendert; }
  function statusVon(r) {
    if (r.auslesen || !hatBild(r)) return 'fertig';
    return r.fehler ? 'fehler' : 'offen';
  }
  function setStatus(t) { $('n8nStatus').textContent = t || ''; }
  function sortieren() { rezepte.sort(function (a, b) { return (b.erstellt || 0) - (a.erstellt || 0); }); }

  function fuerDrive(r) {
    return { id: r.id, titel: r.titel, kat: r.kat, link: r.link, bilder: r.bilder,
      erstellt: r.erstellt, auslesen: r.auslesen || null, fehler: r.fehler || '' };
  }

  /* ---------- Lokaler Speicher (Kopie) ---------- */
  function openDB() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(STORE, { keyPath: 'id' }); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function store(mode) { return db.transaction(STORE, mode).objectStore(STORE); }
  function dbAlle() {
    return new Promise(function (res, rej) {
      var r = store('readonly').getAll();
      r.onsuccess = function () { res(r.result || []); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function dbPut(obj) {
    return new Promise(function (res, rej) {
      var r = store('readwrite').put(obj);
      r.onsuccess = function () { res(); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function dbLoeschen(id) {
    return new Promise(function (res, rej) {
      var r = store('readwrite').delete(id);
      r.onsuccess = function () { res(); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function ersetzeLokal(obj) {
    var i = rezepte.findIndex(function (x) { return x.id === obj.id; });
    if (i >= 0) rezepte[i] = obj; else rezepte.push(obj);
    sortieren();
  }

  /* ---------- Bilder verkleinern ---------- */
  function neuKodieren(src, max, q, nurWennKleiner) {
    return new Promise(function (res, rej) {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, max / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * s));
        var h = Math.max(1, Math.round(img.height * s));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        var out = c.toDataURL('image/jpeg', q);
        res(nurWennKleiner && out.length >= src.length ? src : out);
      };
      img.onerror = function () {
        if (nurWennKleiner) res(src);
        else rej(new Error('Bild konnte nicht gelesen werden.'));
      };
      img.src = src;
    });
  }

  async function bildAusDatei(file, slot) {
    var url = URL.createObjectURL(file);
    try {
      return await neuKodieren(url, slot === 0 ? FOTO_MAX : TEXT_MAX, slot === 0 ? FOTO_Q : TEXT_Q, false);
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  async function rezeptBilderVerkleinern(r) {
    var bilder = r.bilder || [];
    for (var j = 0; j < bilder.length; j++) {
      var b = bilder[j];
      if (b && b.length > 400000) {
        bilder[j] = await neuKodieren(b, j === 0 ? FOTO_MAX : TEXT_MAX, j === 0 ? FOTO_Q : TEXT_Q, true);
      }
    }
    r.bilder = bilder;
  }

  /* ---------- Google-Anmeldung ---------- */
  function tokenGueltig() { return !!accessToken && Date.now() < tokenExpires - 60000; }

  function tokenAusSpeicher() {
    try {
      var t = JSON.parse(localStorage.getItem('gtoken') || 'null');
      if (t && t.token && t.exp > Date.now() + 60000) { accessToken = t.token; tokenExpires = t.exp; }
    } catch (e) { /* kein Token */ }
  }

  function initGoogle() {
    if (clientId().indexOf('HIER_') === 0) return;
    if (!window.google || !google.accounts || !google.accounts.oauth2) { setTimeout(initGoogle, 300); return; }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId(),
      scope: SCOPE,
      callback: function (resp) {
        if (resp && resp.access_token) {
          accessToken = resp.access_token;
          tokenExpires = Date.now() + (resp.expires_in || 3600) * 1000;
          localStorage.setItem('gtoken', JSON.stringify({ token: accessToken, exp: tokenExpires }));
          aktualisiereButtons();
          sync(false);
        } else {
          setStatus('Anmeldung nicht abgeschlossen.');
        }
      }
    });
  }

  function anmelden() {
    if (clientId().indexOf('HIER_') === 0) { setStatus('Bitte zuerst die Client-ID unter ⚙️ Einstellungen eintragen.'); return; }
    if (!tokenClient) { setStatus('Google-Anmeldung lädt noch, bitte gleich nochmal tippen.'); return; }
    tokenClient.requestAccessToken({ prompt: '' });
  }

  /* ---------- Google Drive ---------- */
  async function drive(pfad, opts) {
    if (!tokenGueltig()) throw new Error('NICHT_ANGEMELDET');
    opts = opts || {};
    opts.headers = Object.assign({ Authorization: 'Bearer ' + accessToken }, opts.headers || {});
    var res = await fetch('https://www.googleapis.com' + pfad, opts);
    if (res.status === 401) {
      accessToken = '';
      localStorage.removeItem('gtoken');
      throw new Error('NICHT_ANGEMELDET');
    }
    if (!res.ok) {
      var t = '';
      try { t = await res.text(); } catch (e) { /* egal */ }
      throw new Error('Drive-Fehler ' + res.status + (t ? ': ' + t.slice(0, 120) : ''));
    }
    return res;
  }

  async function ordnerId() {
    var id = localStorage.getItem('ordnerId');
    if (id) return id;
    var q = "name='" + ORDNER_NAME + "' and mimeType='application/vnd.google-apps.folder' and 'root' in parents and trashed=false";
    var r = await (await drive('/drive/v3/files?q=' + encodeURIComponent(q) + '&fields=files(id,name)')).json();
    if (r.files && r.files.length) {
      id = r.files[0].id;
    } else {
      var c = await (await drive('/drive/v3/files?fields=id', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: ORDNER_NAME, mimeType: 'application/vnd.google-apps.folder' })
      })).json();
      id = c.id;
    }
    localStorage.setItem('ordnerId', id);
    return id;
  }

  function multipart(metadata, content) {
    var b = 'rezb' + Date.now();
    var body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) +
      '\r\n--' + b + '\r\nContent-Type: application/json\r\n\r\n' + content + '\r\n--' + b + '--';
    return { body: body, type: 'multipart/related; boundary=' + b };
  }

  async function dateiSchreiben(name, objekt, driveId, status, ordner) {
    var meta = { name: name, mimeType: 'application/json' };
    if (status) meta.properties = { status: status };
    if (!driveId) meta.parents = [ordner];
    var mp = multipart(meta, JSON.stringify(objekt));
    var url = '/upload/drive/v3/files' + (driveId ? '/' + driveId : '') + '?uploadType=multipart&fields=id,modifiedTime';
    var res = await drive(url, {
      method: driveId ? 'PATCH' : 'POST',
      headers: { 'Content-Type': mp.type },
      body: mp.body
    });
    return res.json();
  }

  async function alleDateien(ordner) {
    var out = [];
    var token = '';
    do {
      var q = "'" + ordner + "' in parents and trashed=false";
      var url = '/drive/v3/files?q=' + encodeURIComponent(q) +
        '&fields=nextPageToken,files(id,name,modifiedTime)&pageSize=200' +
        (token ? '&pageToken=' + encodeURIComponent(token) : '');
      var j = await (await drive(url)).json();
      out = out.concat(j.files || []);
      token = j.nextPageToken || '';
    } while (token);
    return out;
  }

  /* ---------- Synchronisieren ---------- */
  async function sync(still) {
    if (!db) return;
    if (laeuft) { nochmal = true; return; }
    if (!tokenGueltig()) {
      aktualisiereButtons();
      if (!still) setStatus('Bitte mit Google anmelden.');
      return;
    }
    laeuft = true;
    aktualisiereButtons();
    try {
      setStatus('Verbinde mit Google Drive …');
      var ordner = await ordnerId();

      // 1) Neues und Geändertes hochladen
      var hoch = rezepte.filter(istLokal);
      for (var i = 0; i < hoch.length; i++) {
        var r = hoch[i];
        setStatus('Lade hoch ' + (i + 1) + ' von ' + hoch.length + ': ' + r.titel + ' …');
        await rezeptBilderVerkleinern(r);
        var d = await dateiSchreiben('rezept_' + r.id + '.json', fuerDrive(r), r.driveId || null, statusVon(r), ordner);
        r.driveId = d.id;
        r.driveModified = d.modifiedTime;
        r.geaendert = false;
        await dbPut(r);
      }

      // 2) Liste aus Drive
      var liste = (await alleDateien(ordner)).filter(function (f) { return /^rezept_[0-9]+\.json$/.test(f.name); });
      var nachDrive = {};
      rezepte.forEach(function (r) { if (r.driveId) nachDrive[r.driveId] = r; });
      var serverIds = {};
      var zuLaden = [];
      liste.forEach(function (f) {
        serverIds[f.id] = true;
        var lok = nachDrive[f.id];
        if (!lok || lok.driveModified !== f.modifiedTime) zuLaden.push(f);
      });

      // 3) Neue oder geänderte Rezepte laden
      for (var k = 0; k < zuLaden.length; k += 3) {
        var teil = zuLaden.slice(k, k + 3);
        setStatus('Lade Rezepte ' + Math.min(k + 3, zuLaden.length) + ' von ' + zuLaden.length + ' …');
        await Promise.all(teil.map(async function (f) {
          var res = await drive('/drive/v3/files/' + f.id + '?alt=media');
          var rez = await res.json();
          if (!rez || !rez.id) return;
          rez.driveId = f.id;
          rez.driveModified = f.modifiedTime;
          rez.geaendert = false;
          await dbPut(rez);
          ersetzeLokal(rez);
        }));
      }

      // 4) Was in Drive nicht mehr existiert, lokal entfernen
      var weg = rezepte.filter(function (r) { return r.driveId && !serverIds[r.driveId]; });
      for (var w = 0; w < weg.length; w++) {
        var wid = weg[w].id;
        await dbLoeschen(wid);
        rezepte = rezepte.filter(function (x) { return x.id !== wid; });
      }

      sortieren();
      zuletztSync = Date.now();
      var offen = rezepte.filter(istOffen).length;
      var fehl = rezepte.filter(istFehler).length;
      var msg = 'Synchronisiert. ';
      if (offen) msg += offen + ' Rezept(e) warten auf n8n. ';
      if (fehl) msg += fehl + ' Auslesen fehlgeschlagen. ';
      if (!offen && !fehl) msg += 'Alles ausgelesen.';
      setStatus(msg.trim());
    } catch (e) {
      if (e && e.message === 'NICHT_ANGEMELDET') setStatus('Anmeldung abgelaufen. Bitte neu anmelden.');
      else setStatus('Fehler: ' + ((e && e.message) || e));
    } finally {
      laeuft = false;
      render();
      if (nochmal) { nochmal = false; setTimeout(function () { sync(true); }, 300); }
    }
  }

  async function loescheRezepte(liste) {
    if (!tokenGueltig()) { alert('Zum Löschen bitte zuerst mit Google anmelden.'); return false; }
    laeuft = true;
    aktualisiereButtons();
    try {
      for (var i = 0; i < liste.length; i++) {
        var r = liste[i];
        setStatus('Lösche ' + (i + 1) + ' von ' + liste.length + ' …');
        if (r.driveId) {
          await drive('/drive/v3/files/' + r.driveId, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ trashed: true })
          });
        }
        await dbLoeschen(r.id);
        var rid = r.id;
        rezepte = rezepte.filter(function (x) { return x.id !== rid; });
      }
      setStatus(liste.length + ' Rezept(e) gelöscht.');
      return true;
    } catch (e) {
      setStatus('Löschen fehlgeschlagen: ' + ((e && e.message) || e));
      return false;
    } finally {
      laeuft = false;
      render();
    }
  }

  async function neuAuslesen(id) {
    var r = rezepte.find(function (x) { return x.id === id; });
    if (!r) return;
    r.auslesen = null;
    r.fehler = '';
    r.geaendert = true;
    await dbPut(r);
    $('detailView').classList.add('hidden');
    render();
    if (tokenGueltig()) sync(true);
    else setStatus('Vorgemerkt. Melde dich mit Google an, dann wird es in Drive abgelegt.');
  }

  function aktualisiereButtons() {
    var eingeloggt = tokenGueltig();
    $('loginBtn').classList.toggle('hidden', eingeloggt);
    $('syncBtn').disabled = laeuft || !eingeloggt;
    $('auswahlBtn').textContent = auswahlModus ? 'Fertig' : 'Auswählen';
    var n = Object.keys(auswahl).length;
    $('loeschenBtn').classList.toggle('hidden', !(auswahlModus && n > 0));
    $('loeschenBtn').textContent = 'Löschen (' + n + ')';
    $('loeschenBtn').disabled = laeuft;
  }

  $('loginBtn').addEventListener('click', anmelden);
  $('syncBtn').addEventListener('click', function () { sync(false); });

  $('auswahlBtn').addEventListener('click', function () {
    auswahlModus = !auswahlModus;
    auswahl = {};
    render();
  });

  $('loeschenBtn').addEventListener('click', async function () {
    var liste = rezepte.filter(function (r) { return auswahl[r.id]; });
    if (!liste.length) return;
    if (!confirm(liste.length + ' Rezept(e) wirklich löschen?')) return;
    var ok = await loescheRezepte(liste);
    if (ok) { auswahlModus = false; auswahl = {}; render(); }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && tokenGueltig() && !laeuft && Date.now() - zuletztSync > 60000) {
      sync(true);
    }
  });

  /* ---------- Liste ---------- */
  function kategorien() {
    var set = {};
    rezepte.forEach(function (r) { set[r.kat || 'Rezepte'] = true; });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'de'); });
  }

  function eiweissVon(r) {
    var nw = r.auslesen && r.auslesen.naehrwerte;
    return (nw && nw.eiweiss) ? String(nw.eiweiss) : '';
  }

  function render() {
    var kats = kategorien();
    if (filter !== 'Alle' && kats.indexOf(filter) === -1) filter = 'Alle';

    $('chips').innerHTML = ['Alle'].concat(kats).map(function (k) {
      return '<button class="chip' + (k === filter ? ' aktiv' : '') + '" data-kat="' + esc(k) + '">' + esc(k) + '</button>';
    }).join('');

    var sichtbar = rezepte.filter(function (r) { return filter === 'Alle' || (r.kat || 'Rezepte') === filter; });

    if (!sichtbar.length) {
      $('liste').innerHTML = '<div class="leerhinweis">Noch keine Rezepte.<br>Tippe oben auf „+ Neu“.</div>';
    } else {
      $('liste').innerHTML = sichtbar.map(function (r) {
        var bild = (r.bilder || []).find(function (b) { return b; });
        var vorschau = bild
          ? '<img class="bild" src="' + bild + '" alt="">'
          : '<div class="leer">🍽️</div>';
        var badge = '';
        if (istLokal(r)) badge = '<span class="badge lokal">nicht in Drive</span>';
        else if (r.auslesen) badge = '<span class="badge fertig">✓ ausgelesen</span>';
        else if (istFehler(r)) badge = '<span class="badge lokal">Auslesen fehlgeschlagen</span>';
        else if (istOffen(r)) badge = '<span class="badge offen">wartet auf n8n</span>';
        var gew = !!auswahl[r.id];
        var haken = auswahlModus ? '<span class="haken">' + (gew ? '✓' : '') + '</span>' : '';
        var eiw = eiweissVon(r);
        return '<div class="karte' + (gew ? ' gewaehlt' : '') + '" data-id="' + esc(r.id) + '">' + badge + haken + vorschau +
          '<div class="info"><div class="titel">' + esc(r.titel) + '</div>' +
          '<div class="kat">' + esc(r.kat || 'Rezepte') + '</div>' +
          (eiw ? '<div class="eiwk">💪 ' + esc(eiw) + ' Eiweiß</div>' : '') +
          '</div></div>';
      }).join('');
    }
    aktualisiereButtons();
  }

  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    filter = b.getAttribute('data-kat');
    render();
  });

  $('liste').addEventListener('click', function (e) {
    var k = e.target.closest('.karte');
    if (!k) return;
    var id = k.getAttribute('data-id');
    if (auswahlModus) {
      if (auswahl[id]) delete auswahl[id]; else auswahl[id] = true;
      render();
    } else {
      zeigeDetail(id);
    }
  });

  /* ---------- Detail ---------- */
  function zeigeDetail(id) {
    var r = rezepte.find(function (x) { return x.id === id; });
    if (!r) return;
    detailId = id;
    var html = '<div class="bar"><button class="ghost" id="detailZu">← Zurück</button></div>';
    html += '<h2>' + esc(r.titel) + '</h2>';
    html += '<div class="kat">' + esc(r.kat || 'Rezepte') + '</div>';

    var link = sichererLink(r.link);
    if (link) html += '<a class="linkbtn" href="' + esc(link) + '" target="_blank" rel="noopener">▶ Video öffnen</a>';

    var bilder = r.bilder || [];
    if (bilder[0]) html += '<div style="height:8px"></div><img src="' + bilder[0] + '" alt="Essen">';

    var a = r.auslesen;
    if (a) {
      var nw = a.naehrwerte || {};
      var rest = [];
      if (nw.kcal) rest.push(esc(nw.kcal) + ' kcal');
      if (nw.kohlenhydrate) rest.push('Kohlenhydrate ' + esc(nw.kohlenhydrate));
      if (nw.fett) rest.push('Fett ' + esc(nw.fett));

      if (nw.eiweiss || rest.length || a.portionen || a.ergibt) {
        html += '<div class="nwbox">';
        if (nw.eiweiss) {
          html += '<div class="eiw"><span class="zahl">' + esc(nw.eiweiss) + '</span><span class="lbl">Eiweiß</span></div>';
        }
        if (rest.length) html += '<div class="rest">' + rest.join(' · ') + '</div>';
        if (nw.bezugsgroesse) html += '<div class="bezug">' + esc(nw.bezugsgroesse) + '</div>';
        if (a.portionen) html += '<div class="bezug">Portionen: ' + esc(a.portionen) + '</div>';
        if (a.ergibt) html += '<div class="bezug">Ergibt: ' + esc(a.ergibt) + '</div>';
        html += '</div>';
      }

      if (a.zutaten && a.zutaten.length) {
        html += '<div class="abschnitt">Zutaten</div><ul>' +
          a.zutaten.map(function (z) { return '<li>' + esc(z) + '</li>'; }).join('') + '</ul>';
        html += '<div class="aktionen"><button class="ghost" id="zuEinkaufBtn">🛒 Zutaten auf die Einkaufsliste</button></div>';
      }
      if (a.zubereitung && a.zubereitung.length) {
        html += '<div class="abschnitt">Zubereitung</div><ol>' +
          a.zubereitung.map(function (z) { return '<li>' + esc(z) + '</li>'; }).join('') + '</ol>';
      }
    } else if (istFehler(r)) {
      html += '<div class="hinweisbox">⚠️ ' + esc(r.fehler) + '</div>';
    } else if (istOffen(r)) {
      html += '<div class="hinweisbox">Noch nicht ausgelesen. Starte zu Hause den Kurzbefehl, dann verarbeitet n8n dieses Rezept.</div>';
    }

    bilder.forEach(function (b, i) {
      if (!b || i === 0) return;
      html += '<div class="abschnitt">' + SLOTS[i] + '</div><img src="' + b + '" alt="' + SLOTS[i] + '">';
    });

    html += '<div class="aktionen">';
    if (hatBild(r)) html += '<button class="ghost" id="neuAuslesenBtn">↻ Neu auslesen</button>';
    html += '<button class="ghost" id="bearbeitenBtn">Bearbeiten</button>' +
            '<button class="danger" id="loeschenEinzelBtn">Löschen</button></div>';

    $('detailInhalt').innerHTML = html;
    $('detailView').classList.remove('hidden');
    $('detailView').scrollTop = 0;
  }

  $('detailInhalt').addEventListener('click', async function (e) {
    var id = e.target.id;
    if (id === 'detailZu') {
      $('detailView').classList.add('hidden');
    } else if (id === 'bearbeitenBtn') {
      $('detailView').classList.add('hidden');
      oeffneForm(detailId);
    } else if (id === 'neuAuslesenBtn') {
      if (confirm('Dieses Rezept neu auslesen lassen? Die bisherigen ausgelesenen Daten werden ersetzt.')) neuAuslesen(detailId);
    } else if (id === 'zuEinkaufBtn') {
      var rz = rezepte.find(function (x) { return x.id === detailId; });
      if (!rz) return;
      var n = zutatenZuEinkauf(rz);
      e.target.textContent = n ? '✓ ' + n + ' Zutaten hinzugefügt' : '✓ Schon auf der Liste';
    } else if (id === 'loeschenEinzelBtn') {
      var r = rezepte.find(function (x) { return x.id === detailId; });
      if (!r || !confirm('Dieses Rezept wirklich löschen?')) return;
      var ok = await loescheRezepte([r]);
      if (ok) $('detailView').classList.add('hidden');
    }
  });

  /* ---------- Formular ---------- */
  function oeffneForm(id) {
    editId = id || null;
    var r = id ? rezepte.find(function (x) { return x.id === id; }) : null;
    $('formTitel').textContent = r ? 'Rezept bearbeiten' : 'Neues Rezept';
    $('fTitel').value = r ? r.titel : '';
    $('fKat').value = r ? (r.kat || 'Rezepte') : (filter !== 'Alle' ? filter : '');
    $('fLink').value = r ? (r.link || '') : '';
    formBilder = [null, null, null, null];
    if (r && r.bilder) r.bilder.forEach(function (b, i) { if (i < 4) formBilder[i] = b || null; });
    $('fFehler').textContent = '';
    $('katListe').innerHTML = kategorien().map(function (k) { return '<option value="' + esc(k) + '">'; }).join('');
    renderSlots();
    $('formView').classList.remove('hidden');
    $('formView').scrollTop = 0;
  }

  function renderSlots() {
    $('slots').innerHTML = SLOTS.map(function (name, i) {
      var b = formBilder[i];
      if (b) {
        return '<div class="slot" data-i="' + i + '"><img src="' + b + '" alt="">' +
          '<span class="tag">' + name + '</span>' +
          '<button class="weg" data-weg="' + i + '" aria-label="Bild entfernen">✕</button></div>';
      }
      return '<div class="slot" data-i="' + i + '"><div class="plus">+</div><div class="name">' + name + '</div></div>';
    }).join('');
  }

  $('slots').addEventListener('click', function (e) {
    var weg = e.target.closest('[data-weg]');
    if (weg) {
      e.stopPropagation();
      formBilder[parseInt(weg.getAttribute('data-weg'), 10)] = null;
      renderSlots();
      return;
    }
    var s = e.target.closest('.slot');
    if (!s) return;
    aktuellerSlot = parseInt(s.getAttribute('data-i'), 10);
    $('fileInput').value = '';
    $('fileInput').click();
  });

  $('fileInput').addEventListener('change', async function () {
    var f = this.files && this.files[0];
    if (!f) return;
    $('fFehler').textContent = '';
    try {
      formBilder[aktuellerSlot] = await bildAusDatei(f, aktuellerSlot);
      renderSlots();
    } catch (err) {
      $('fFehler').textContent = err.message || 'Bild konnte nicht geladen werden.';
    }
  });

  $('neuBtn').addEventListener('click', function () { oeffneForm(null); });
  $('formZu').addEventListener('click', function () { $('formView').classList.add('hidden'); });

  $('speichernBtn').addEventListener('click', async function () {
    var titel = $('fTitel').value.trim();
    if (!titel) { $('fFehler').textContent = 'Bitte einen Titel eingeben.'; return; }

    var alt = editId ? rezepte.find(function (x) { return x.id === editId; }) : null;
    var neueBilder = formBilder.slice();
    var bilderGleich = alt && (alt.bilder || []).join('|') === neueBilder.join('|');

    var obj = {
      id: editId || String(Date.now()),
      titel: titel,
      kat: $('fKat').value.trim() || 'Rezepte',
      link: $('fLink').value.trim(),
      bilder: neueBilder,
      erstellt: alt ? alt.erstellt : Date.now(),
      auslesen: (alt && bilderGleich) ? (alt.auslesen || null) : null,
      fehler: (alt && bilderGleich) ? (alt.fehler || '') : '',
      driveId: alt ? alt.driveId : undefined,
      driveModified: alt ? alt.driveModified : undefined,
      geaendert: true
    };

    try {
      await dbPut(obj);
    } catch (err) {
      $('fFehler').textContent = 'Speichern hat nicht geklappt. Ist der Speicher voll?';
      return;
    }
    ersetzeLokal(obj);
    $('formView').classList.add('hidden');
    render();

    if (tokenGueltig()) sync(true);
    else setStatus('Lokal gespeichert. Melde dich mit Google an, dann wird es in Drive abgelegt.');
  });

  /* ---------- Einkaufsliste ---------- */
  async function einkaufLaden() {
    if (!tokenGueltig()) return;
    try {
      var ordner = await ordnerId();
      if (!einkaufId) {
        var q = "name='einkaufsliste.json' and '" + ordner + "' in parents and trashed=false";
        var j = await (await drive('/drive/v3/files?q=' + encodeURIComponent(q) + '&fields=files(id)')).json();
        if (j.files && j.files.length) { einkaufId = j.files[0].id; localStorage.setItem('einkaufId', einkaufId); }
      }
      if (einkaufId) {
        var d = await (await drive('/drive/v3/files/' + einkaufId + '?alt=media')).json();
        if (d && Array.isArray(d.items)) einkauf = d;
      }
      localStorage.setItem('einkaufCache', JSON.stringify(einkauf));
    } catch (e) { /* Kopie bleibt */ }
  }

  async function einkaufSpeichern() {
    if (!tokenGueltig()) return;
    try {
      var ordner = await ordnerId();
      var d = await dateiSchreiben('einkaufsliste.json', einkauf, einkaufId || null, null, ordner);
      if (!einkaufId) { einkaufId = d.id; localStorage.setItem('einkaufId', einkaufId); }
    } catch (e) { setStatus('Einkaufsliste konnte nicht gespeichert werden.'); }
  }

  function einkaufSpeichernSpaeter() {
    localStorage.setItem('einkaufCache', JSON.stringify(einkauf));
    clearTimeout(einkaufTimer);
    einkaufTimer = setTimeout(einkaufSpeichern, 800);
  }

  function zutatenZuEinkauf(r) {
    var z = (r.auslesen && r.auslesen.zutaten) || [];
    var n = 0;
    z.forEach(function (t) {
      var da = einkauf.items.some(function (x) { return x.rid === r.id && x.text === t; });
      if (!da) { einkauf.items.push({ rid: r.id, rezept: r.titel, text: t, erledigt: false, rest: '' }); n++; }
    });
    einkaufSpeichernSpaeter();
    return n;
  }

  // Zeigt die Zutat mit der Restmenge: "4 Eier" + noch 2 => "2 Eier"
  function anzeigeText(it) {
    var rest = String(it.rest == null ? '' : it.rest).trim();
    if (rest === '') return it.text;
    if (rest === '0') return it.text + ' – schon da';
    var m = /^\s*(\d+\/\d+|\d+(?:[.,]\d+)?)(.*)$/.exec(it.text);
    if (m && !/^[-–\/]/.test(m[2])) {
      var abstand = /^[\s.,]/.test(m[2]) || m[2] === '' ? '' : ' ';
      return rest + abstand + m[2];
    }
    return it.text + ' (noch ' + rest + ')';
  }

  function renderEinkauf() {
    var gruppen = {};
    var reihenfolge = [];
    einkauf.items.forEach(function (it, idx) {
      var g = it.rezept || 'Sonstiges';
      if (!gruppen[g]) { gruppen[g] = []; reihenfolge.push(g); }
      gruppen[g].push(idx);
    });
    if (!reihenfolge.length) {
      $('einkaufInhalt').innerHTML = '<div class="leerhinweis" style="padding:30px 0">Die Liste ist leer.</div>';
      return;
    }
    $('einkaufInhalt').innerHTML = reihenfolge.map(function (g) {
      return '<div class="gruppe">' + esc(g) + '</div>' + gruppen[g].map(function (idx) {
        var it = einkauf.items[idx];
        var fertig = it.erledigt || String(it.rest == null ? '' : it.rest).trim() === '0';
        return '<div class="pos' + (fertig ? ' erledigt' : '') + '" data-row="' + idx + '">' +
          '<input type="checkbox" data-chk="' + idx + '"' + (it.erledigt ? ' checked' : '') + '>' +
          '<span data-txt="' + idx + '">' + esc(anzeigeText(it)) + '</span>' +
          '<input type="text" class="rest" inputmode="decimal" autocomplete="off" aria-label="Noch nötig" placeholder="noch" data-rest="' + idx + '" value="' + esc(it.rest == null ? '' : it.rest) + '">' +
          '</div>';
      }).join('');
    }).join('');
  }

  $('einkaufBtn').addEventListener('click', async function () {
    renderEinkauf();
    $('einkaufView').classList.remove('hidden');
    $('einkaufView').scrollTop = 0;
    await einkaufLaden();
    var aktiv = document.activeElement;
    if (!(aktiv && aktiv.getAttribute && aktiv.getAttribute('data-rest') !== null)) renderEinkauf();
  });
  $('einkaufZu').addEventListener('click', function () { $('einkaufView').classList.add('hidden'); });

  $('einkaufInhalt').addEventListener('change', function (e) {
    var chk = e.target.getAttribute('data-chk');
    if (chk === null) return;
    einkauf.items[parseInt(chk, 10)].erledigt = e.target.checked;
    einkaufSpeichernSpaeter();
    renderEinkauf();
  });

  $('einkaufInhalt').addEventListener('input', function (e) {
    var ri = e.target.getAttribute('data-rest');
    if (ri === null) return;
    var idx = parseInt(ri, 10);
    var it = einkauf.items[idx];
    if (!it) return;
    it.rest = e.target.value.trim();
    var txt = $('einkaufInhalt').querySelector('[data-txt="' + idx + '"]');
    if (txt) txt.textContent = anzeigeText(it);
    var row = $('einkaufInhalt').querySelector('[data-row="' + idx + '"]');
    if (row) row.classList.toggle('erledigt', it.erledigt || it.rest === '0');
    einkaufSpeichernSpaeter();
  });

  function neuePosition() {
    var t = $('neuPosText').value.trim();
    if (!t) return;
    einkauf.items.push({ rid: '', rezept: '', text: t, erledigt: false, rest: '' });
    $('neuPosText').value = '';
    einkaufSpeichernSpaeter();
    renderEinkauf();
  }
  $('neuPosBtn').addEventListener('click', neuePosition);
  $('neuPosText').addEventListener('keydown', function (e) { if (e.key === 'Enter') neuePosition(); });

  $('erledigteWeg').addEventListener('click', function () {
    einkauf.items = einkauf.items.filter(function (x) {
      return !(x.erledigt || String(x.rest == null ? '' : x.rest).trim() === '0');
    });
    einkaufSpeichernSpaeter();
    renderEinkauf();
  });
  $('alleWeg').addEventListener('click', function () {
    if (!einkauf.items.length || !confirm('Die ganze Einkaufsliste leeren?')) return;
    einkauf.items = [];
    einkaufSpeichernSpaeter();
    renderEinkauf();
  });

  /* ---------- Einstellungen ---------- */
  function zeigeSettings() {
    $('sClient').value = localStorage.getItem('clientId') || '';
    $('sOrdner').value = localStorage.getItem('ordnerId') || '(noch nicht angelegt: erst mit Google anmelden)';
    $('sKonto').textContent = tokenGueltig()
      ? 'Angemeldet. Die Anmeldung gilt etwa eine Stunde, danach tippst du wieder auf „Mit Google anmelden“.'
      : 'Nicht angemeldet.';
    $('settingsView').classList.remove('hidden');
  }
  $('settingsBtn').addEventListener('click', zeigeSettings);
  $('settingsZu').addEventListener('click', function () { $('settingsView').classList.add('hidden'); });
  $('sClientSave').addEventListener('click', function () {
    var v = $('sClient').value.trim();
    if (v) localStorage.setItem('clientId', v); else localStorage.removeItem('clientId');
    location.reload();
  });
  $('sKopieren').addEventListener('click', function () {
    var v = $('sOrdner').value;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v);
    else { $('sOrdner').select(); document.execCommand('copy'); }
    $('sKopieren').textContent = '✓ Kopiert';
  });
  $('sOrdnerNeu').addEventListener('click', function () {
    localStorage.removeItem('ordnerId');
    localStorage.removeItem('einkaufId');
    einkaufId = '';
    $('sOrdner').value = '(wird beim nächsten Synchronisieren neu gesucht)';
  });
  $('sAbmelden').addEventListener('click', function () {
    if (accessToken && window.google && google.accounts && google.accounts.oauth2) {
      google.accounts.oauth2.revoke(accessToken, function () { /* fertig */ });
    }
    accessToken = '';
    tokenExpires = 0;
    localStorage.removeItem('gtoken');
    aktualisiereButtons();
    $('settingsView').classList.add('hidden');
    setStatus('Abgemeldet.');
  });

  /* ---------- Start ---------- */
  (async function () {
    try {
      db = await openDB();
      rezepte = await dbAlle();
      sortieren();
      render();
    } catch (err) {
      $('liste').innerHTML = '<div class="leerhinweis">Der Speicher im Browser ist nicht verfügbar.<br>Öffne die Seite nicht im privaten Modus.</div>';
      return;
    }
    tokenAusSpeicher();
    initGoogle();
    aktualisiereButtons();
    if (tokenGueltig()) sync(true);
    else if (clientId().indexOf('HIER_') === 0) setStatus('Bitte unter ⚙️ Einstellungen die Google Client-ID eintragen.');
    else setStatus('Nicht angemeldet. Du siehst die zuletzt geladenen Rezepte.');
  })();
</script>
</body>
</html>
