<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rezepte</title>
<style>
  :root {
    --bg: #161412;
    --card: #232019;
    --card2: #2d2a22;
    --text: #f2ede4;
    --muted: #a39b8b;
    --accent: #e8a33d;
    --danger: #e0645c;
    --ok: #6fbf73;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); min-height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 18px 16px 8px; max-width: 900px; margin: 0 auto; }
  h1 { margin: 0; font-size: 28px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 11px 16px;
    background: var(--accent); color: #1b1408; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: var(--card2); color: var(--text); font-weight: 600; }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  #n8nBox { max-width: 900px; margin: 0 auto; padding: 4px 16px 8px; display: flex;
    align-items: center; gap: 12px; flex-wrap: wrap; }
  #n8nStatus { color: var(--muted); font-size: 14px; flex: 1; min-width: 160px; }
  #chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px 12px;
    max-width: 900px; margin: 0 auto; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; background: var(--card); color: var(--muted); border-radius: 999px;
    padding: 8px 14px; font-weight: 600; font-size: 14px; }
  .chip.aktiv { background: var(--accent); color: #1b1408; }
  #liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px; padding: 4px 16px 40px; max-width: 900px; margin: 0 auto; }
  .karte { background: var(--card); border-radius: var(--radius); overflow: hidden; cursor: pointer; position: relative; }
  .karte .bild { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: var(--card2); }
  .karte .leer { width: 100%; aspect-ratio: 1 / 1; display: flex; align-items: center;
    justify-content: center; font-size: 40px; background: var(--card2); }
  .karte .info { padding: 10px 12px 12px; }
  .karte .titel { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .karte .kat { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .badge { position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 700;
    padding: 3px 8px; border-radius: 8px; background: rgba(0,0,0,.7); }
  .badge.offen { color: var(--accent); }
  .badge.fertig { color: var(--ok); }
  .leerhinweis { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 20px; }
  .overlay { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 10;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .hidden { display: none; }
  .sheet { max-width: 700px; margin: 0 auto; padding: 14px 16px 60px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .bar h2 { margin: 0; font-size: 18px; text-align: center; flex: 1; }
  label { display: block; margin: 16px 0 6px; font-weight: 700; font-size: 14px; }
  input[type="text"], input[type="url"] { width: 100%; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid #3a362c; border-radius: 12px; padding: 13px 14px; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .slot { position: relative; aspect-ratio: 1 / 1; background: var(--card); border: 2px dashed #4a4538;
    border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: var(--muted); cursor: pointer; text-align: center; }
  .slot .plus { font-size: 34px; line-height: 1; color: var(--accent); }
  .slot .name { font-size: 13px; font-weight: 600; margin-top: 6px; }
  .slot img { width: 100%; height: 100%; object-fit: cover; }
  .slot .tag { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.65);
    color: #fff; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 8px; }
  .slot .weg { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; padding: 0;
    border-radius: 50%; background: rgba(0,0,0,.7); color: #fff; font-size: 16px; line-height: 30px; }
  .fehler { color: var(--danger); min-height: 20px; margin: 12px 0 0; font-size: 14px; }
  .detail h2 { font-size: 26px; margin: 4px 0 4px; }
  .detail .kat { color: var(--muted); margin-bottom: 14px; }
  .detail .abschnitt { margin: 20px 0 8px; font-weight: 700; color: var(--accent); font-size: 14px;
    text-transform: uppercase; letter-spacing: .04em; }
  .detail img { width: 100%; display: block; border-radius: var(--radius); background: var(--card2); }
  .detail ul, .detail ol { margin: 0; padding-left: 22px; line-height: 1.55; }
  .detail li { margin-bottom: 6px; }
  .detail .nw { color: var(--muted); line-height: 1.6; }
  .detail .hinweis { color: var(--muted); font-size: 14px; background: var(--card); padding: 12px 14px;
    border-radius: 12px; margin-top: 16px; }
  .linkbtn { display: inline-block; text-decoration: none; background: var(--accent); color: #1b1408;
    font-weight: 700; padding: 11px 16px; border-radius: 12px; margin: 4px 0 6px; }
  .aktionen { display: flex; gap: 10px; margin-top: 28px; }
  .aktionen button { flex: 1; }
</style>
</head>
<body>

<header>
  <h1>🍳 Rezepte</h1>
  <button id="neuBtn">+ Neu</button>
</header>

<div id="n8nBox">
  <button class="ghost" id="n8nBtn">n8n verarbeiten</button>
  <span id="n8nStatus"></span>
</div>

<div id="chips"></div>
<main id="liste"></main>

<!-- Formular -->
<div id="formView" class="overlay hidden">
  <div class="sheet">
    <div class="bar">
      <button class="ghost" id="formZu">Abbrechen</button>
      <h2 id="formTitel">Neues Rezept</h2>
      <button id="speichernBtn">Speichern</button>
    </div>

    <label for="fTitel">Titel</label>
    <input type="text" id="fTitel" placeholder="z. B. Protein-Nuggets" autocomplete="off">

    <label for="fKat">Kategorie</label>
    <input type="text" id="fKat" list="katListe" placeholder="Rezepte" autocomplete="off">
    <datalist id="katListe"></datalist>

    <label for="fLink">Link zum Video</label>
    <input type="url" id="fLink" placeholder="https://www.instagram.com/reel/..." autocomplete="off">

    <label>Bilder</label>
    <div class="slots" id="slots"></div>
    <input type="file" id="fileInput" accept="image/*" class="hidden">

    <p class="fehler" id="fFehler"></p>
  </div>
</div>

<!-- Detail -->
<div id="detailView" class="overlay hidden">
  <div class="sheet detail" id="detailInhalt"></div>
</div>

<script>
  /* ====== EINSTELLUNG ======
     Production-URL aus dem n8n-Webhook-Node (Workflow muss "Active" sein).
     Für Tests im Test-Modus: http://localhost:5678/webhook-test/rezept */
  var N8N_URL = 'http://localhost:5678/webhook/rezept';
  var N8N_TIMEOUT_MS = 5 * 60 * 1000;
  /* =========================== */

  var DB_NAME = 'rezepte-v2';
  var STORE = 'rezepte';
  var SLOTS = ['Essen', 'Zutaten', 'Zubereitung', 'Weiteres'];

  var db = null;
  var rezepte = [];
  var filter = 'Alle';
  var editId = null;
  var formBilder = [null, null, null, null];
  var aktuellerSlot = 0;
  var detailId = null;
  var laeuft = false;

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function sichererLink(u) {
    u = (u || '').trim();
    if (!u) return '';
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return /^https?:\/\//i.test(u) ? u : '';
  }

  function istOffen(r) {
    return !r.auslesen && (r.bilder || []).some(function (b) { return b; });
  }

  /* ---------- Datenbank ---------- */
  function openDB() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(STORE, { keyPath: 'id' }); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function store(mode) { return db.transaction(STORE, mode).objectStore(STORE); }
  function dbAlle() {
    return new Promise(function (res, rej) {
      var r = store('readonly').getAll();
      r.onsuccess = function () { res(r.result || []); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function dbSpeichern(obj) {
    return new Promise(function (res, rej) {
      var r = store('readwrite').put(obj);
      r.onsuccess = function () { res(); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function dbLoeschen(id) {
    return new Promise(function (res, rej) {
      var r = store('readwrite').delete(id);
      r.onsuccess = function () { res(); };
      r.onerror = function () { rej(r.error); };
    });
  }
  async function laden() {
    rezepte = await dbAlle();
    rezepte.sort(function (a, b) { return (b.erstellt || 0) - (a.erstellt || 0); });
    render();
  }

  /* ---------- Bild verkleinern ---------- */
  function bildKomprimieren(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var max = 1600;
        var s = Math.min(1, max / Math.max(img.width, img.height));
        var w = Math.round(img.width * s);
        var h = Math.round(img.height * s);
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        rej(new Error('Bild konnte nicht gelesen werden.'));
      };
      img.src = url;
    });
  }

  /* ---------- n8n ---------- */
  function setStatus(t) { $('n8nStatus').textContent = t || ''; }

  function aktualisiereN8nBtn() {
    var n = rezepte.filter(istOffen).length;
    $('n8nBtn').textContent = n ? 'n8n verarbeiten (' + n + ' offen)' : 'n8n verarbeiten';
    $('n8nBtn').disabled = laeuft;
  }

  async function sendeAnN8n(r) {
    var bilder = (r.bilder || []);
    var senden = bilder.slice(1).filter(function (b) { return b; });
    if (!senden.length) senden = bilder.filter(function (b) { return b; });

    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, N8N_TIMEOUT_MS);
    try {
      var res = await fetch(N8N_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: r.id, titel: r.titel, link: r.link || '', bilder: senden }),
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error('n8n antwortet mit Fehler ' + res.status);
      var data = await res.json();
      if (Array.isArray(data)) data = data[0] || {};
      return data;
    } finally {
      clearTimeout(timer);
    }
  }

  async function verarbeiten(still) {
    if (laeuft || !db) return;
    var offene = rezepte.filter(istOffen);
    if (!offene.length) {
      if (!still) setStatus('Nichts offen. Alles ist ausgelesen.');
      return;
    }
    laeuft = true;
    aktualisiereN8nBtn();

    var fertig = 0;
    var letzterFehler = '';

    for (var i = 0; i < offene.length; i++) {
      var r = offene[i];
      setStatus('Verarbeite ' + (i + 1) + ' von ' + offene.length + ': ' + r.titel + ' … (kann etwas dauern)');
      try {
        var data = await sendeAnN8n(r);
        if (data && data.ok) {
          r.auslesen = {
            portionen: data.portionen || '',
            zutaten: Array.isArray(data.zutaten) ? data.zutaten : [],
            zubereitung: Array.isArray(data.zubereitung) ? data.zubereitung : [],
            naehrwerte: data.naehrwerte || {}
          };
          r.fehler = '';
          await dbSpeichern(r);
          fertig++;
        } else {
          r.fehler = (data && data.fehler) || 'Antwort konnte nicht gelesen werden';
          await dbSpeichern(r);
          letzterFehler = r.fehler;
        }
      } catch (e) {
        letzterFehler = e.name === 'AbortError'
          ? 'Zeitüberschreitung'
          : 'n8n nicht erreichbar';
        break;
      }
    }

    laeuft = false;
    await laden();

    var rest = rezepte.filter(istOffen).length;
    if (fertig && !rest) setStatus('Fertig: ' + fertig + ' Rezept(e) ausgelesen.');
    else if (letzterFehler) setStatus((fertig ? fertig + ' ausgelesen. ' : '') + rest + ' noch offen. Grund: ' + letzterFehler);
    else setStatus(rest + ' noch offen.');
  }

  $('n8nBtn').addEventListener('click', function () { verarbeiten(false); });

  /* ---------- Liste ---------- */
  function kategorien() {
    var set = {};
    rezepte.forEach(function (r) { set[r.kat || 'Rezepte'] = true; });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'de'); });
  }

  function render() {
    var kats = kategorien();
    if (filter !== 'Alle' && kats.indexOf(filter) === -1) filter = 'Alle';

    $('chips').innerHTML = ['Alle'].concat(kats).map(function (k) {
      return '<button class="chip' + (k === filter ? ' aktiv' : '') + '" data-kat="' + esc(k) + '">' + esc(k) + '</button>';
    }).join('');

    var sichtbar = rezepte.filter(function (r) { return filter === 'Alle' || (r.kat || 'Rezepte') === filter; });

    if (!sichtbar.length) {
      $('liste').innerHTML = '<div class="leerhinweis">Noch keine Rezepte.<br>Tippe oben auf „+ Neu“.</div>';
    } else {
      $('liste').innerHTML = sichtbar.map(function (r) {
        var bild = (r.bilder || []).find(function (b) { return b; });
        var vorschau = bild
          ? '<img class="bild" src="' + bild + '" alt="">'
          : '<div class="leer">🍽️</div>';
        var badge = r.auslesen
          ? '<span class="badge fertig">✓ ausgelesen</span>'
          : (istOffen(r) ? '<span class="badge offen">offen</span>' : '');
        return '<div class="karte" data-id="' + esc(r.id) + '">' + badge + vorschau +
          '<div class="info"><div class="titel">' + esc(r.titel) + '</div>' +
          '<div class="kat">' + esc(r.kat || 'Rezepte') + '</div></div></div>';
      }).join('');
    }
    aktualisiereN8nBtn();
  }

  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    filter = b.getAttribute('data-kat');
    render();
  });

  $('liste').addEventListener('click', function (e) {
    var k = e.target.closest('.karte');
    if (!k) return;
    zeigeDetail(k.getAttribute('data-id'));
  });

  /* ---------- Detail ---------- */
  function zeigeDetail(id) {
    var r = rezepte.find(function (x) { return x.id === id; });
    if (!r) return;
    detailId = id;
    var html = '<div class="bar"><button class="ghost" id="detailZu">← Zurück</button></div>';
    html += '<h2>' + esc(r.titel) + '</h2>';
    html += '<div class="kat">' + esc(r.kat || 'Rezepte') + '</div>';

    var link = sichererLink(r.link);
    if (link) html += '<a class="linkbtn" href="' + esc(link) + '" target="_blank" rel="noopener">▶ Video öffnen</a>';

    var bilder = r.bilder || [];
    if (bilder[0]) html += '<div style="height:8px"></div><img src="' + bilder[0] + '" alt="Essen">';

    var a = r.auslesen;
    if (a) {
      if (a.portionen) html += '<div class="abschnitt">Portionen</div><div>' + esc(a.portionen) + '</div>';
      if (a.zutaten && a.zutaten.length) {
        html += '<div class="abschnitt">Zutaten</div><ul>' +
          a.zutaten.map(function (z) { return '<li>' + esc(z) + '</li>'; }).join('') + '</ul>';
      }
      if (a.zubereitung && a.zubereitung.length) {
        html += '<div class="abschnitt">Zubereitung</div><ol>' +
          a.zubereitung.map(function (z) { return '<li>' + esc(z) + '</li>'; }).join('') + '</ol>';
      }
      var nw = a.naehrwerte || {};
      var teile = [];
      if (nw.kcal) teile.push(esc(nw.kcal) + ' kcal');
      if (nw.eiweiss) teile.push('Eiweiß ' + esc(nw.eiweiss));
      if (nw.kohlenhydrate) teile.push('Kohlenhydrate ' + esc(nw.kohlenhydrate));
      if (nw.fett) teile.push('Fett ' + esc(nw.fett));
      if (teile.length) {
        html += '<div class="abschnitt">Nährwerte' + (nw.bezugsgroesse ? ' (' + esc(nw.bezugsgroesse) + ')' : '') +
          '</div><div class="nw">' + teile.join(' · ') + '</div>';
      }
    } else if (istOffen(r)) {
      html += '<div class="hinweis">Noch nicht ausgelesen. Tippe auf der Startseite auf „n8n verarbeiten“.' +
        (r.fehler ? '<br>Letzter Fehler: ' + esc(r.fehler) : '') + '</div>';
    }

    bilder.forEach(function (b, i) {
      if (!b || i === 0) return;
      html += '<div class="abschnitt">' + SLOTS[i] + '</div><img src="' + b + '" alt="' + SLOTS[i] + '">';
    });

    html += '<div class="aktionen"><button class="ghost" id="bearbeitenBtn">Bearbeiten</button>' +
            '<button class="danger" id="loeschenBtn">Löschen</button></div>';

    $('detailInhalt').innerHTML = html;
    $('detailView').classList.remove('hidden');
    $('detailView').scrollTop = 0;
  }

  $('detailInhalt').addEventListener('click', async function (e) {
    if (e.target.id === 'detailZu') {
      $('detailView').classList.add('hidden');
    } else if (e.target.id === 'bearbeitenBtn') {
      $('detailView').classList.add('hidden');
      oeffneForm(detailId);
    } else if (e.target.id === 'loeschenBtn') {
      if (confirm('Dieses Rezept wirklich löschen?')) {
        await dbLoeschen(detailId);
        $('detailView').classList.add('hidden');
        await laden();
      }
    }
  });

  /* ---------- Formular ---------- */
  function oeffneForm(id) {
    editId = id || null;
    var r = id ? rezepte.find(function (x) { return x.id === id; }) : null;
    $('formTitel').textContent = r ? 'Rezept bearbeiten' : 'Neues Rezept';
    $('fTitel').value = r ? r.titel : '';
    $('fKat').value = r ? (r.kat || 'Rezepte') : (filter !== 'Alle' ? filter : '');
    $('fLink').value = r ? (r.link || '') : '';
    formBilder = [null, null, null, null];
    if (r && r.bilder) r.bilder.forEach(function (b, i) { if (i < 4) formBilder[i] = b || null; });
    $('fFehler').textContent = '';
    $('katListe').innerHTML = kategorien().map(function (k) { return '<option value="' + esc(k) + '">'; }).join('');
    renderSlots();
    $('formView').classList.remove('hidden');
    $('formView').scrollTop = 0;
  }

  function renderSlots() {
    $('slots').innerHTML = SLOTS.map(function (name, i) {
      var b = formBilder[i];
      if (b) {
        return '<div class="slot" data-i="' + i + '"><img src="' + b + '" alt="">' +
          '<span class="tag">' + name + '</span>' +
          '<button class="weg" data-weg="' + i + '" aria-label="Bild entfernen">✕</button></div>';
      }
      return '<div class="slot" data-i="' + i + '"><div class="plus">+</div><div class="name">' + name + '</div></div>';
    }).join('');
  }

  $('slots').addEventListener('click', function (e) {
    var weg = e.target.closest('[data-weg]');
    if (weg) {
      e.stopPropagation();
      formBilder[parseInt(weg.getAttribute('data-weg'), 10)] = null;
      renderSlots();
      return;
    }
    var s = e.target.closest('.slot');
    if (!s) return;
    aktuellerSlot = parseInt(s.getAttribute('data-i'), 10);
    $('fileInput').value = '';
    $('fileInput').click();
  });

  $('fileInput').addEventListener('change', async function () {
    var f = this.files && this.files[0];
    if (!f) return;
    $('fFehler').textContent = '';
    try {
      formBilder[aktuellerSlot] = await bildKomprimieren(f);
      renderSlots();
    } catch (err) {
      $('fFehler').textContent = err.message || 'Bild konnte nicht geladen werden.';
    }
  });

  $('neuBtn').addEventListener('click', function () { oeffneForm(null); });
  $('formZu').addEventListener('click', function () { $('formView').classList.add('hidden'); });

  $('speichernBtn').addEventListener('click', async function () {
    var titel = $('fTitel').value.trim();
    if (!titel) { $('fFehler').textContent = 'Bitte einen Titel eingeben.'; return; }

    var alt = editId ? rezepte.find(function (x) { return x.id === editId; }) : null;
    var neueBilder = formBilder.slice();
    var bilderGleich = alt && (alt.bilder || []).join('|') === neueBilder.join('|');

    var obj = {
      id: editId || String(Date.now()),
      titel: titel,
      kat: $('fKat').value.trim() || 'Rezepte',
      link: $('fLink').value.trim(),
      bilder: neueBilder,
      erstellt: alt ? alt.erstellt : Date.now(),
      auslesen: (alt && bilderGleich) ? (alt.auslesen || null) : null,
      fehler: ''
    };

    try {
      await dbSpeichern(obj);
