<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meine Rezepte</title>
<style>
:root{--bg:#faf6f0;--card:#fff;--tx:#2b2620;--mu:#7a6f62;--ac:#d9622b;--bd:#e8dfd2;--in:#fff;--wa:#fff3d6}
@media (prefers-color-scheme:dark){:root{--bg:#1c1915;--card:#27231e;--tx:#f2ebe0;--mu:#a89c8b;--ac:#f08a52;--bd:#3a342c;--in:#1c1915;--wa:#3a2f14}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px 10px;z-index:5;border-bottom:1px solid var(--bd)}
h1{margin:0 0 10px;font-size:22px}
.row{display:flex;gap:8px;align-items:center}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);font:inherit;font-size:16px}
textarea{min-height:110px;resize:vertical}
label{display:block;margin:14px 0 5px;font-weight:600;font-size:14px}
button{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--ac);color:#fff}
button:disabled{opacity:.5;cursor:default}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.del{background:#c0392b}
main{padding:14px 16px 90px;max-width:720px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer}
.card .ph{aspect-ratio:1;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:36px}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{padding:10px;font-weight:600;font-size:14px}
.card .m{padding:0 10px 10px;color:var(--mu);font-size:12px}
.badge{position:absolute;top:8px;left:8px;background:var(--ac);color:#fff;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.view{display:none}
.view.on{display:block}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bd)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb b{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.add{border:2px dashed var(--bd);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--mu);cursor:pointer}
.imgs{display:grid;gap:10px;margin:12px 0}
.imgs img{width:100%;border-radius:12px;cursor:zoom-in}
pre{white-space:pre-wrap;font:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:6px 0}
h3{margin:18px 0 4px}
a.src{display:inline-block;margin:8px 0;color:var(--ac);font-weight:600;word-break:break-all}
.empty{text-align:center;color:var(--mu);margin-top:50px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:20}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.ai{margin-top:16px;width:100%;padding:14px;font-size:16px}
.st{margin:8px 0 0;font-size:13px;color:var(--mu);min-height:18px}
.st.err{color:#c0392b}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{margin:0}
.gear{background:transparent;color:var(--tx);font-size:22px;padding:4px 8px}
.q{background:var(--wa);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:14px;display:none}
.q.on{display:block}
.q button{width:100%;margin-top:8px}
.note{background:var(--wa);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
</style>
</head>
<body>

<div id="v-list" class="view on">
  <header>
    <div class="top"><h1>🍳 Meine Rezepte</h1><button class="gear" id="gear" title="Einstellungen">⚙️</button></div>
    <div class="row" style="margin-top:10px"><input id="q" type="search" placeholder="Suchen (Titel, Zutaten …)"></div>
  </header>
  <main>
    <div class="q" id="queue">
      <b id="qtxt"></b>
      <div style="font-size:13px;color:var(--mu);margin-top:2px">Starte n8n auf dem Rechner und tippe dann auf den Button.</div>
      <button id="runq">▶ Alle offenen jetzt verarbeiten</button>
      <div class="st" id="qst"></div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty">Noch keine Rezepte.<br>Tippe auf + zum Hinzufügen.</div>
    <div class="bar">
      <button class="sec" id="exp">Backup exportieren</button>
      <button class="sec" id="imp">Backup importieren</button>
      <input id="impf" type="file" accept="application/json" hidden>
    </div>
  </main>
  <button class="fab" id="new">+</button>
</div>

<div id="v-form" class="view">
  <header><h1 id="ftitle">Neues Rezept</h1></header>
  <main>
    <label>Link zum Video (Facebook / Instagram)</label>
    <input id="f-link" type="url" placeholder="https://…">
    <label>Bilder / Screenshots (max. 4)</label>
    <div class="thumbs" id="thumbs"></div>
    <input id="f-file" type="file" accept="image/*" multiple hidden>
    <div class="note" id="hint">Nur Link und Bilder reichen: Das Rezept wird als „offen“ gespeichert und später gesammelt ausgelesen.</div>
    <button class="ai sec" id="ai" disabled>✨ Jetzt sofort auslesen (n8n muss laufen)</button>
    <div class="st" id="aist"></div>
    <label>Titel (optional)</label>
    <input id="f-title" placeholder="z. B. Protein-Pasta">
    <label>Zutaten</label>
    <textarea id="f-ing" placeholder="Eine Zutat pro Zeile"></textarea>
    <label>Zubereitung</label>
    <textarea id="f-steps"></textarea>
    <label>Nährwerte</label>
    <textarea id="f-nutr" style="min-height:70px" placeholder="z. B. 520 kcal, 38 g Eiweiß, 45 g Kohlenhydrate, 18 g Fett"></textarea>
    <div class="bar">
      <button id="save">Speichern</button>
      <button id="saven">Speichern &amp; nächstes</button>
      <button class="sec" id="cancel">Abbrechen</button>
    </div>
  </main>
</div>

<div id="v-det" class="view">
  <header><div class="row"><button class="sec" id="back">← Zurück</button></div></header>
  <main id="det"></main>
</div>

<div class="lb" id="lb"><img id="lbi" alt=""></div>

<script>
const $=s=>document.querySelector(s);
const MAX_IMG=4, HOOK_KEY='rezepte_webhook';
let db, recipes=[], cur=null, formImgs=[];

/* ---------- IndexedDB ---------- */
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('rezepte',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('r',{keyPath:'id'});
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error);
});}
const tx=(m)=>db.transaction('r',m).objectStore('r');
const getAll=()=>new Promise((res,rej)=>{const q=tx('readonly').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const put=o=>new Promise((res,rej)=>{const q=tx('readwrite').put(o);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});
const del=id=>new Promise((res,rej)=>{const q=tx('readwrite').delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});

/* ---------- Webhook ---------- */
const getHook=()=>{try{return localStorage.getItem(HOOK_KEY)||''}catch(e){return ''}};
const setHook=v=>{try{localStorage.setItem(HOOK_KEY,v)}catch(e){}};
function ensureHook(){
  let h=getHook();
  if(!h){
    h=(prompt('n8n-Webhook-URL eintragen (wird nur in diesem Browser gespeichert):','')||'').trim();
    if(h)setHook(h);
  }
  return h;
}
async function callHook(hook,images,link){
  const res=await fetch(hook,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({images,link:link||''})});
  if(!res.ok)throw new Error('Server antwortete mit '+res.status);
  return await res.json();
}
function fmt(d){
  return {
    title:d.title||'',
    ing:Array.isArray(d.ingredients)?d.ingredients.join('\n'):'',
    steps:Array.isArray(d.steps)?d.steps.map((s,i)=>(i+1)+'. '+String(s).replace(/^\d+[\.\)]\s*/,'')).join('\n'):'',
    nutr:d.nutrition?d.nutrition+(d.nutrition_estimated?'\n(geschätzt)':''):''
  };
}
const isNet=e=>e instanceof TypeError;

/* ---------- Bilder verkleinern ---------- */
function shrink(file){return new Promise((res,rej)=>{
  const img=new Image(), u=URL.createObjectURL(file);
  img.onload=()=>{
    const m=1400, s=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);
    res(c.toDataURL('image/jpeg',0.75));
  };
  img.onerror=()=>rej(new Error('Bild konnte nicht gelesen werden'));
  img.src=u;
});}

/* ---------- Ansichten ---------- */
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0)}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pending=()=>recipes.filter(r=>r.status==='offen'&&r.imgs.length);

function renderList(){
  const q=$('#q').value.trim().toLowerCase();
  const list=recipes.filter(r=>!q||[r.title,r.ing,r.steps,r.link].join(' ').toLowerCase().includes(q))
    .sort((a,b)=>b.created-a.created);
  $('#empty').style.display=recipes.length?'none':'block';
  $('#grid').innerHTML=list.map(r=>`
    <div class="card" data-id="${r.id}">
      ${r.status==='offen'?'<span class="badge">⏳ offen</span>':''}
      <div class="ph">${r.imgs[0]?`<img src="${r.imgs[0]}" alt="">`:'🍽️'}</div>
      <div class="t">${esc(r.title)||'Ohne Titel'}</div>
      <div class="m">${r.imgs.length} Bild${r.imgs.length===1?'':'er'}${r.link?' · Link':''}</div>
    </div>`).join('');
  const n=pending().length;
  $('#queue').classList.toggle('on',n>0);
  $('#qtxt').textContent=n+' Rezept'+(n===1?'':'e')+' warten auf Verarbeitung';
}

function renderDetail(r){
  cur=r;
  $('#det').innerHTML=`
    <h2>${esc(r.title)||'Ohne Titel'}</h2>
    ${r.status==='offen'?'<div class="note">⏳ Noch nicht ausgelesen. Wird bei „Alle offenen verarbeiten“ erledigt.</div>':''}
    ${r.link?`<a class="src" href="${esc(r.link)}" target="_blank" rel="noopener">▶ Video öffnen</a>`:''}
    <div class="imgs">${r.imgs.map(s=>`<img src="${s}" alt="">`).join('')}</div>
    ${r.ing?`<h3>Zutaten</h3><pre>${esc(r.ing)}</pre>`:''}
    ${r.steps?`<h3>Zubereitung</h3><pre>${esc(r.steps)}</pre>`:''}
    ${r.nutr?`<h3>Nährwerte</h3><pre>${esc(r.nutr)}</pre>`:''}
    <div class="bar">
      <button id="edit">Bearbeiten</button>
      <button class="del" id="rm">Löschen</button>
    </div>`;
  $('#edit').onclick=()=>openForm(r);
  $('#rm').onclick=async()=>{
    if(confirm('Rezept wirklich löschen?')){await del(r.id);await reload();show('#v-list')}
  };
  show('#v-det');
}

function renderThumbs(){
  let h=formImgs.map((s,i)=>`<div class="thumb"><img src="${s}" alt=""><b data-i="${i}">×</b></div>`).join('');
  if(formImgs.length<MAX_IMG)h+=`<div class="thumb add" id="addimg">＋</div>`;
  $('#thumbs').innerHTML=h;
  $('#thumbs').querySelectorAll('b').forEach(b=>b.onclick=()=>{formImgs.splice(+b.dataset.i,1);renderThumbs()});
  const a=$('#addimg');if(a)a.onclick=()=>$('#f-file').click();
  $('#ai').disabled=!formImgs.length;
}

function setStatus(t,err){const s=$('#aist');s.textContent=t||'';s.className='st'+(err?' err':'')}
function qStatus(t,err){const s=$('#qst');s.textContent=t||'';s.className='st'+(err?' err':'')}

function openForm(r,msg){
  cur=r||null;
  $('#ftitle').textContent=r?'Rezept bearbeiten':'Neues Rezept';
  $('#f-title').value=r?.title||'';
  $('#f-link').value=r?.link||'';
  $('#f-ing').value=r?.ing||'';
  $('#f-steps').value=r?.steps||'';
  $('#f-nutr').value=r?.nutr||'';
  formImgs=r?[...r.imgs]:[];
  setStatus(msg||'');renderThumbs();show('#v-form');
}

/* ---------- Sofort auslesen (Formular) ---------- */
async function autoRead(){
  const hook=ensureHook();if(!hook)return;
  const btn=$('#ai');btn.disabled=true;setStatus('Lese Rezept aus … das dauert ca. 10–30 Sekunden.');
  try{
    const f=fmt(await callHook(hook,formImgs,$('#f-link').value.trim()));
    if(f.title&&!$('#f-title').value.trim())$('#f-title').value=f.title;
    if(f.ing)$('#f-ing').value=f.ing;
    if(f.steps)$('#f-steps').value=f.steps;
    if(f.nutr)$('#f-nutr').value=f.nutr;
    setStatus('Fertig. Bitte kurz prüfen und speichern.');
  }catch(err){
    setStatus(isNet(err)?'n8n nicht erreichbar. Speichere das Rezept einfach als „offen“ und verarbeite es später.':'Fehler: '+err.message,true);
  }
  btn.disabled=!formImgs.length;
}

/* ---------- Warteschlange abarbeiten ---------- */
async function runQueue(){
  const list=pending();if(!list.length)return;
  const hook=ensureHook();if(!hook)return;
  const btn=$('#runq');btn.disabled=true;
  let ok=0,fail=0,stopped=false;
  for(let i=0;i<list.length;i++){
    const r=list[i];
    qStatus('Verarbeite '+(i+1)+' von '+list.length+': '+(r.title||'Ohne Titel')+' …');
    try{
      const f=fmt(await callHook(hook,r.imgs,r.link));
      if(f.title&&!r.title)r.title=f.title;
      r.ing=f.ing||r.ing;r.steps=f.steps||r.steps;r.nutr=f.nutr||r.nutr;
      r.status='fertig';
      await put(r);ok++;
      recipes=await getAll();renderList();$('#runq').disabled=true;
    }catch(err){
      if(isNet(err)){stopped=true;break}
      fail++;
    }
  }
  btn.disabled=false;
  if(stopped)qStatus('n8n nicht erreichbar. Läuft n8n und stimmt die URL (⚙️)? Offene Rezepte bleiben erhalten.',true);
  else qStatus('Fertig: '+ok+' verarbeitet'+(fail?', '+fail+' fehlgeschlagen (bleiben offen)':'')+'.',fail>0);
}

/* ---------- Speichern ---------- */
async function doSave(next){
  const title=$('#f-title').value.trim(), link=$('#f-link').value.trim();
  const ing=$('#f-ing').value.trim(), steps=$('#f-steps').value.trim(), nutr=$('#f-nutr').value.trim();
  if(!title&&!link&&!formImgs.length){alert('Bitte mindestens Titel, Link oder ein Bild angeben.');return}
  const r={
    id:cur?cur.id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),
    created:cur?cur.created:Date.now(),
    title,link,imgs:formImgs,ing,steps,nutr,
    status:(formImgs.length&&!ing&&!steps&&!nutr)?'offen':'fertig'
  };
  try{
    await put(r);await reload();
    if(next)openForm(null,'Gespeichert ✓ Nächstes Rezept:');
    else renderDetail(recipes.find(x=>x.id===r.id));
  }catch(err){alert('Speichern fehlgeschlagen: '+err.message)}
}

/* ---------- Events ---------- */
$('#new').onclick=()=>openForm(null);
$('#cancel').onclick=()=>show('#v-list');
$('#back').onclick=()=>show('#v-list');
$('#q').oninput=renderList;
$('#ai').onclick=autoRead;
$('#runq').onclick=runQueue;
$('#save').onclick=()=>doSave(false);
$('#saven').onclick=()=>doSave(true);
$('#gear').onclick=()=>{
  const v=prompt('n8n-Webhook-URL:',getHook());
  if(v!==null)setHook(v.trim());
};
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(c)renderDetail(recipes.find(r=>r.id===c.dataset.id))};

$('#f-file').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';
  for(const f of files){
    if(formImgs.length>=MAX_IMG){alert('Maximal '+MAX_IMG+' Bilder pro Rezept.');break}
    try{formImgs.push(await shrink(f))}catch(err){alert(err.message)}
  }
  renderThumbs();
};

/* Lightbox */
$('#det').onclick=e=>{if(e.target.matches('.imgs img')){$('#lbi').src=e.target.src;$('#lb').classList.add('on')}};
$('#lb').onclick=()=>$('#lb').classList.remove('on');

/* Backup */
$('#exp').onclick=()=>{
  const b=new Blob([JSON.stringify(recipes)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='rezepte-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
};
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!Array.isArray(data))throw new Error('Ungültige Datei');
    for(const r of data)if(r&&r.id&&Array.isArray(r.imgs))await put(r);
    await reload();alert('Backup importiert.');
  }catch(err){alert('Import fehlgeschlagen: '+err.message)}
  e.target.value='';
};

async function reload(){recipes=await getAll();renderList()}
(async()=>{
  try{db=await openDB();await reload()}
  catch(err){document.body.innerHTML='<p style="padding:20px">Speicher nicht verfügbar: '+esc(err.message)+'</p>'}
})();
</script>
</body>
</html>
